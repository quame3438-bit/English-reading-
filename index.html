<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文网页双语阅读</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202938;font:16px system-ui,-apple-system,sans-serif}header{position:sticky;top:0;background:white;padding:14px;box-shadow:0 2px 10px #0001;z-index:2}.bar{max-width:1400px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}input,button,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:11px}input{flex:1;min-width:200px}button{background:#2563eb;color:white;cursor:pointer;border:0}button.secondary{background:#e7eefb;color:#234}main{display:block;padding:12px;max-width:1500px;margin:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}.pair>section{min-width:0;background:white;border-radius:10px;padding:15px;line-height:1.8;overflow-wrap:anywhere;white-space:pre-wrap}.pair>section:nth-child(2){background:#f0f6ff}.headings{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-weight:700;padding:10px 15px}.empty{padding:25px;background:white;border-radius:10px}.pane{background:white;border-radius:12px;min-width:0;overflow:hidden}.title{padding:12px 16px;font-weight:700;border-bottom:1px solid #eee}.content{padding:18px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;min-height:60vh}.content p{margin:0 0 1em}.muted{color:#64748b}.note{max-width:1400px;margin:8px auto;padding:0 14px;color:#64748b;font-size:13px}textarea{width:100%;min-height:260px;resize:vertical}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:5;align-items:center;justify-content:center;padding:15px}.dialog{background:white;padding:20px;border-radius:14px;width:min(760px,100%)}@media(max-width:650px){main{gap:5px;padding:5px}.content{padding:9px;font-size:14px}.title{padding:9px}.bar button{flex:1}}</style></head><body><header><div class="bar"><input id="query" placeholder="输入英文关键词或英文网页网址（https://…）"><button id="go">搜索 / 打开</button><button class="secondary" id="paste">粘贴英文文章</button><button class="secondary" id="translate">翻译右侧</button></div></header><div class="note" id="status">输入关键词搜索英文网页；或粘贴英文文章进行左右对照翻译。</div><main><div class="headings"><div>🇬🇧 英文原文</div><div>🇨🇳 中文翻译</div></div><div id="pairs"><div class="empty muted">英文和中文将在这里逐段对应显示。</div></div></main><div class="overlay" id="modal"><div class="dialog"><h3>粘贴英文文章</h3><textarea id="source" placeholder="将英文网页的正文复制粘贴到这里…"></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="secondary" id="cancel">取消</button><button id="apply">开始阅读</button></div></div></div><script>
const $=id=>document.getElementById(id);let english='',segments=[],version=0;
const setStatus=t=>$('status').textContent=t;
function splitText(t){let paragraphs=t.replace(/\r/g,'').split(/\n\s*\n|\n(?=[A-Z][^\n]{30,})/).map(x=>x.trim()).filter(Boolean);let result=[];for(let p of paragraphs){if(p.length<=750){result.push(p);continue}let sentences=p.match(/[^.!?。！？]+[.!?。！？]+[”"']?|[^.!?。！？]+$/g)||[p];let buf='';for(let sentence of sentences){if((buf+sentence).length>650&&buf){result.push(buf.trim());buf=''}if(sentence.length>750){for(let i=0;i<sentence.length;i+=650)result.push(sentence.slice(i,i+650));}else buf+=sentence}if(buf.trim())result.push(buf.trim())}return result}
function showEnglish(t){english=t.trim();segments=splitText(english);version++;const wrap=$('pairs');wrap.replaceChildren();if(!segments.length){wrap.innerHTML='<div class="empty muted">没有英文内容。</div>';return}segments.forEach((part,i)=>{const row=document.createElement('div');row.className='pair';const en=document.createElement('section');en.textContent=part;const zh=document.createElement('section');zh.id='zh'+i;zh.className='muted';zh.textContent='等待翻译…';row.append(en,zh);wrap.append(row)});setStatus('已加载 '+segments.length+' 段英文，点击「翻译右侧」逐段翻译。')}
$('paste').onclick=()=>$('modal').style.display='flex';$('cancel').onclick=()=>$('modal').style.display='none';$('apply').onclick=()=>{showEnglish($('source').value);$('modal').style.display='none'};
$('go').onclick=async()=>{let q=$('query').value.trim();if(!q)return;if(!/^https?:\/\//i.test(q)){window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');setStatus('已打开谷歌搜索；找到文章后可以粘贴正文。');return}try{let u=new URL(q);setStatus('正在尝试读取网页…');let res=await fetch('https://r.jina.ai/'+u.href);if(!res.ok)throw Error('读取失败');showEnglish(await res.text());setStatus('网页文本已提取，点击「翻译右侧」。')}catch(e){setStatus('网页无法自动读取，请复制正文后粘贴。');window.open(q,'_blank')}};
$('translate').onclick=async()=>{if(!segments.length){setStatus('请先打开网页或粘贴英文文章。');return}let current=version,failed=0;$('translate').disabled=true;try{for(let i=0;i<segments.length;i++){if(current!==version)break;setStatus('正在翻译第 '+(i+1)+' / '+segments.length+' 段…');let el=$('zh'+i);try{const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(segments[i]);let r=await fetch(url);if(!r.ok)throw Error('接口错误');let data=await r.json();if(current!==version)break;el.textContent=data[0].map(x=>x[0]).join('');el.classList.remove('muted')}catch(e){failed++;el.textContent='翻译失败（网络或接口限制）'}}if(current===version)setStatus(failed?'已完成，'+failed+' 段翻译失败，可再次点击重试。':'翻译完成，左右逐段对齐。')}finally{$('translate').disabled=false}};
$('query').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
</script></body></html>
