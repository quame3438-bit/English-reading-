<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文网页双语阅读</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202938;font:16px system-ui,-apple-system,sans-serif}header{position:sticky;top:0;background:white;padding:14px;box-shadow:0 2px 10px #0001;z-index:2}.bar{max-width:1400px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}input,button,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:11px}input{flex:1;min-width:200px}button{background:#2563eb;color:white;cursor:pointer;border:0}button.secondary{background:#e7eefb;color:#234}main{display:block;padding:12px;max-width:1500px;margin:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}.pair>section{min-width:0;background:white;border-radius:10px;padding:15px;line-height:1.8;overflow-wrap:anywhere;white-space:pre-wrap}.pair>section:nth-child(2){background:#f0f6ff}.headings{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-weight:700;padding:10px 15px}.empty{padding:25px;background:white;border-radius:10px}.pane{background:white;border-radius:12px;min-width:0;overflow:hidden}.title{padding:12px 16px;font-weight:700;border-bottom:1px solid #eee}.content{padding:18px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;min-height:60vh}.content p{margin:0 0 1em}.muted{color:#64748b}.note{max-width:1400px;margin:8px auto;padding:0 14px;color:#64748b;font-size:13px}textarea{width:100%;min-height:260px;resize:vertical}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:5;align-items:center;justify-content:center;padding:15px}.dialog{background:white;padding:20px;border-radius:14px;width:min(760px,100%)}@media(max-width:650px){main{gap:5px;padding:5px}.content{padding:9px;font-size:14px}.title{padding:9px}.bar button{flex:1}}
.word{cursor:pointer;border-radius:3px}.word:active{background:#dbeafe}.dict-mask{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:flex-end;justify-content:center}.dict-box{background:#fff;border-radius:18px 18px 0 0;width:min(620px,100%);padding:18px;max-height:80vh;overflow:auto;box-shadow:0 -5px 25px #0002}.dict-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.dict-top h2{margin:0}.dict-phon{color:#64748b;margin:8px 0}.dict-actions{display:flex;gap:8px;flex-wrap:wrap}.dict-actions button{padding:8px 12px}.dict-detail{display:none;border-top:1px solid #e2e8f0;margin-top:12px;padding-top:12px}.dict-detail.open{display:block}.dict-box p{line-height:1.65}.dict-box li{margin:8px 0}.dict-close{background:#e2e8f0;color:#334155}

.library{max-width:1500px;margin:10px auto;padding:0 12px}.library details{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px #0001}.library summary{font-weight:700;cursor:pointer}.lib-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.lib-toolbar select{flex:1;min-width:130px;border:1px solid #cbd5e1;border-radius:9px;padding:9px;background:white;font:inherit}.lib-toolbar button{padding:9px 10px;font-size:14px}.lib-item{border-top:1px solid #e5e7eb;padding:10px 0;display:flex;align-items:center;gap:7px}.lib-item .lib-name{flex:1;min-width:0;overflow-wrap:anywhere;color:#1d4ed8;text-align:left;background:transparent;padding:5px 0}.lib-item .lib-mini{background:#e7eefb;color:#234;padding:7px;font-size:13px;min-height:35px}.lib-item .lib-delete{background:#fee2e2;color:#991b1b}.lib-url{color:#64748b;font-size:12px;overflow-wrap:anywhere}.lib-empty{color:#64748b;font-size:14px;padding:12px 0}

/* 允许 iPhone Safari 长按选择任意长度的原文并复制 */
#pairs, #pairs section, #pairs .word { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
#pairs .word { -webkit-tap-highlight-color:transparent; }
</style></head><body><header><div class="bar"><input id="query" placeholder="输入英文关键词或英文网页网址（https://…）"><button id="go">搜索 / 打开</button><button class="secondary" id="paste">粘贴英文文章</button><button class="secondary" id="translate">翻译右侧</button></div></header><div class="note" id="status">输入关键词搜索英文网页；或粘贴英文文章进行左右对照翻译。</div><div class="library"><details id="libraryDetails"><summary>📚 已保存的网址（本机自动保存）</summary><div class="lib-toolbar"><select id="libCategory" aria-label="当前分类"></select><button id="libNewCat">新建分类</button><button class="secondary" id="libRenameCat">重命名</button><button class="secondary" id="libDeleteCat">删除分类</button></div><div id="libItems"></div><p class="muted" style="font-size:12px">打开或粘贴网址后自动保存到当前分类。仅保存在当前浏览器中，清理网站数据可能导致记录丢失。</p></details></div><main><div class="headings"><div>🇬🇧 英文原文</div><div>🇨🇳 中文翻译</div></div><div id="pairs"><div class="empty muted">英文和中文将在这里逐段对应显示。</div></div></main><div class="dict-mask" id="dictMask"><div class="dict-box" role="dialog" aria-modal="true" aria-label="单词词典"><div class="dict-top"><h2 id="dictWord"></h2><button class="dict-close" id="dictClose">关闭</button></div><div class="dict-phon" id="dictPhon"></div><div class="dict-actions"><button id="speakUS">🔊 美音</button><button id="speakUK">🔊 英音</button><button id="youdaoOpen" class="secondary">📖 有道完整释义 ↗</button></div><p id="dictBrief">正在查询…</p><button class="secondary" id="dictExpand">详细解释 ▼</button><div class="dict-detail" id="dictDetail"></div></div></div><div class="overlay" id="modal"><div class="dialog"><h3>粘贴英文文章</h3><textarea id="source" placeholder="将英文网页的正文复制粘贴到这里…"></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="secondary" id="cancel">取消</button><button id="apply">开始阅读</button></div></div></div><script>
const $=id=>document.getElementById(id);let english='',segments=[],version=0;
const setStatus=t=>$('status').textContent=t;
function splitText(t){let paragraphs=t.replace(/\r/g,'').split(/\n\s*\n|\n(?=[A-Z][^\n]{30,})/).map(x=>x.trim()).filter(Boolean);let result=[];for(let p of paragraphs){if(p.length<=750){result.push(p);continue}let sentences=p.match(/[^.!?。！？]+[.!?。！？]+[”"']?|[^.!?。！？]+$/g)||[p];let buf='';for(let sentence of sentences){if((buf+sentence).length>650&&buf){result.push(buf.trim());buf=''}if(sentence.length>750){for(let i=0;i<sentence.length;i+=650)result.push(sentence.slice(i,i+650));}else buf+=sentence}if(buf.trim())result.push(buf.trim())}return result}
function showEnglish(t){english=t.trim();segments=splitText(english);version++;const wrap=$('pairs');wrap.replaceChildren();if(!segments.length){wrap.innerHTML='<div class="empty muted">没有英文内容。</div>';return}segments.forEach((part,i)=>{const row=document.createElement('div');row.className='pair';const en=document.createElement('section');en.append(...part.split(/([A-Za-z]+(?:[’'-][A-Za-z]+)*)/g).map(piece=>{if(/^[A-Za-z]+(?:[’'-][A-Za-z]+)*$/.test(piece)){let w=document.createElement('span');w.className='word';w.textContent=piece;w.dataset.word=piece;return w}return document.createTextNode(piece)}));const zh=document.createElement('section');zh.id='zh'+i;zh.className='muted';zh.textContent='等待翻译…';row.append(en,zh);wrap.append(row)});setStatus('已加载 '+segments.length+' 段英文，点击「翻译右侧」逐段翻译。')}
$('paste').onclick=()=>$('modal').style.display='flex';$('cancel').onclick=()=>$('modal').style.display='none';$('apply').onclick=()=>{showEnglish($('source').value);$('modal').style.display='none'};
$('go').onclick=async()=>{let q=$('query').value.trim();if(!q)return;if(!/^https?:\/\//i.test(q)){window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');setStatus('已打开谷歌搜索；找到文章后可以粘贴正文。');return}try{let u=new URL(q);libAutoSave(u.href);setStatus('正在尝试读取网页…');let res=await fetch('https://r.jina.ai/'+u.href);if(!res.ok)throw Error('读取失败');showEnglish(await res.text());setStatus('网页文本已提取，点击「翻译右侧」。')}catch(e){setStatus('网页无法自动读取，请复制正文后粘贴。');window.open(q,'_blank')}};
$('translate').onclick=async()=>{if(!segments.length){setStatus('请先打开网页或粘贴英文文章。');return}let current=version,failed=0;$('translate').disabled=true;try{for(let i=0;i<segments.length;i++){if(current!==version)break;setStatus('正在翻译第 '+(i+1)+' / '+segments.length+' 段…');let el=$('zh'+i);try{const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(segments[i]);let r=await fetch(url);if(!r.ok)throw Error('接口错误');let data=await r.json();if(current!==version)break;el.textContent=data[0].map(x=>x[0]).join('');el.classList.remove('muted')}catch(e){failed++;el.textContent='翻译失败（网络或接口限制）'}}if(current===version)setStatus(failed?'已完成，'+failed+' 段翻译失败，可再次点击重试。':'翻译完成，左右逐段对齐。')}finally{$('translate').disabled=false}};
$('query').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});

// 长按（手机）或双击（电脑）单词查看词典
let pressTimer=null, pressed=false, activeWord='', dictionaryData=null;
const mask=$('dictMask'), detail=$('dictDetail');
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(locale){if(!activeWord)return;const entry=dictionaryData?.phonetics||[];let audio=entry.find(x=>x.audio&&((locale==='en-US'&&/us/i.test(x.audio))||(locale==='en-GB'&&/uk/i.test(x.audio))))?.audio;if(audio){new Audio(audio).play().catch(()=>speech(locale))}else speech(locale)}
function speech(locale){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(activeWord);u.lang=locale;u.rate=.85;window.speechSynthesis.speak(u)}
$('youdaoOpen').onclick=()=>{if(activeWord)window.open('https://dict.youdao.com/result?word='+encodeURIComponent(activeWord)+'&lang=en','_blank','noopener,noreferrer')};$('speakUS').onclick=()=>speak('en-US');$('speakUK').onclick=()=>speak('en-GB');
$('dictClose').onclick=()=>{mask.style.display='none';dictRequest++};mask.addEventListener('click',e=>{if(e.target===mask){mask.style.display='none';dictRequest++}});
$('dictExpand').onclick=()=>{detail.classList.toggle('open');$('dictExpand').textContent=detail.classList.contains('open')?'收起详细解释 ▲':'详细解释 ▼'};
async function translateWord(w){try{let r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(w));if(!r.ok)throw Error();let j=await r.json();return j[0].map(x=>x[0]).join('')}catch{return '中文释义暂不可用'}}
// 双接口查询：DictionaryAPI 优先，Datamuse 备用；有道词典提供完整释义跳转；失败时保留中文释义与发音。
const dictCache=new Map();let dictRequest=0;
async function fetchJSON(url,timeout=7000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);try{const response=await fetch(url,{signal:controller.signal});if(!response.ok)throw new Error('HTTP '+response.status);return await response.json()}finally{clearTimeout(timer)}}
function renderPrimary(entry){let html='';for(const meaning of entry.meanings||[]){html+='<h3>'+escapeHTML(meaning.partOfSpeech||'词性未标注')+'</h3><ol>';for(const d of (meaning.definitions||[]).slice(0,8)){html+='<li>'+escapeHTML(d.definition||'');if(d.example)html+='<p><b>例句：</b>'+escapeHTML(d.example)+'</p>';if(d.synonyms?.length)html+='<p>近义词：'+escapeHTML(d.synonyms.slice(0,6).join(', '))+'</p>';html+='</li>'}html+='</ol>'}return html}
async function lookupDict(word){let errors=[];
 try{const entries=await fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word));if(Array.isArray(entries)&&entries[0]?.meanings?.length)return {entry:entries[0],html:renderPrimary(entries[0]),source:'Free Dictionary API'}}catch(e){errors.push('主词典：'+e.message)}
 try{const results=await fetchJSON('https://api.datamuse.com/words?sp='+encodeURIComponent(word)+'&md=d,p&max=10');const item=Array.isArray(results)?results.find(x=>x.word?.toLowerCase()===word.toLowerCase()&&x.defs?.length):null;if(item){let html='<p class="muted">备用词典提供英文释义，部分单词不含例句。</p><ol>';for(const def of item.defs.slice(0,12)){let i=def.indexOf('\t');let pos=i<0?'':def.slice(0,i);let meaning=i<0?def:def.slice(i+1);html+='<li>'+escapeHTML((pos?('['+pos+'] '):'')+meaning)+'</li>'}html+='</ol>';return {entry:{phonetic:item.tags?.find(t=>t.startsWith('pron:'))?.slice(5)||'',phonetics:[]},html,source:'Datamuse 备用词典'}}}catch(e){errors.push('备用词典：'+e.message)}
 return {entry:null,html:'<p>在线词典暂时无法返回详细释义。中文翻译与发音仍可使用。</p><p class="muted">可能是网络连接、接口限制，或该词没有收录。</p><button type="button" id="retryDict" class="secondary">重新查询</button>',source:''};}
async function openDict(w){const target=w.toLowerCase(),request=++dictRequest;activeWord=target;dictionaryData=null;mask.style.display='flex';$('dictWord').textContent=w;$('dictPhon').textContent='';$('dictBrief').textContent='正在查询中文释义…';detail.classList.remove('open');detail.textContent='正在查询词典…';$('dictExpand').textContent='详细解释 ▼';
 translateWord(target).then(t=>{if(request===dictRequest)$('dictBrief').textContent='中文：'+t});
 try{let data=dictCache.get(target);if(!data){data=await lookupDict(target);if(data.entry)dictCache.set(target,data)}if(request!==dictRequest)return;dictionaryData=data.entry;$('dictPhon').textContent=data.entry?.phonetic||data.entry?.phonetics?.find(x=>x.text)?.text||'音标暂无数据（可点击有道查看）';detail.innerHTML=data.html+(data.source?'<p class="muted">释义来源：'+escapeHTML(data.source)+'</p>':'');const retry=$('retryDict');if(retry)retry.onclick=()=>openDict(target)}catch(e){if(request===dictRequest)detail.textContent='查询暂时失败，请稍后重试。'}}
const pairs=$('pairs');
// 长按使用浏览器原生文本选择与复制（支持跨单词、跨句子选取）。
// 双击仍查询单词，不拦截系统复制菜单。
pairs.addEventListener('dblclick',e=>{let w=e.target.closest('.word');if(w)openDict(w.dataset.word)});

// 本机网址收藏夹：按分类自动保存，可编辑、移动、删除。
const LIB_KEY='bilingual_reader_url_library_v1';
let lib;
try{lib=JSON.parse(localStorage.getItem(LIB_KEY))}catch(e){}
if(!lib||!Array.isArray(lib.categories)||!Array.isArray(lib.items))lib={categories:[{id:'default',name:'默认分类'}],items:[],selected:'default'};
if(!lib.categories.length)lib.categories=[{id:'default',name:'默认分类'}];
if(!lib.categories.some(c=>c.id===lib.selected))lib.selected=lib.categories[0].id;
function libPersist(){try{localStorage.setItem(LIB_KEY,JSON.stringify(lib))}catch(e){setStatus('网址保存失败：浏览器存储空间不足或禁止本机存储。')}}
function libId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function libRender(){
 const sel=$('libCategory');sel.replaceChildren();
 lib.categories.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.append(o)});
 sel.value=lib.selected;
 const box=$('libItems');box.replaceChildren();
 const items=lib.items.filter(i=>i.category===lib.selected);
 if(!items.length){const d=document.createElement('div');d.className='lib-empty';d.textContent='此分类暂无网址。打开一个英文网址后会自动保存。';box.append(d);return}
 items.forEach(item=>{
  const row=document.createElement('div');row.className='lib-item';
  const left=document.createElement('div');left.style.cssText='flex:1;min-width:0';
  const name=document.createElement('button');name.className='lib-name';name.textContent=item.title||item.url;name.title='点击加载网址';name.onclick=()=>{$('query').value=item.url;$('go').click()};
  const url=document.createElement('div');url.className='lib-url';url.textContent=item.url;left.append(name,url);
  const edit=document.createElement('button');edit.className='lib-mini';edit.textContent='编辑';edit.onclick=()=>{
   const title=prompt('网址名称：',item.title||item.url);if(title===null)return;
   const address=prompt('网址（https://…）：',item.url);if(address===null)return;
   let u;try{u=new URL(address.trim());if(!['http:','https:'].includes(u.protocol))throw Error()}catch(e){alert('请输入有效的 http 或 https 网址');return}
   item.title=title.trim()||u.hostname;item.url=u.href;libPersist();libRender();
  };
  const move=document.createElement('button');move.className='lib-mini';move.textContent='分类';move.onclick=()=>{
   const options=lib.categories.map((c,i)=>`${i+1}. ${c.name}`).join('\n');const choice=prompt('移动到哪个分类？输入序号：\n'+options);
   if(choice===null)return;const c=lib.categories[Number(choice)-1];if(!c){alert('分类序号无效');return}item.category=c.id;libPersist();libRender();
  };
  const del=document.createElement('button');del.className='lib-mini lib-delete';del.textContent='删除';del.onclick=()=>{if(confirm('确定删除此网址？')){lib.items=lib.items.filter(x=>x.id!==item.id);libPersist();libRender()}};
  row.append(left,edit,move,del);box.append(row);
 });
}
function libAutoSave(url){
 let u;try{u=new URL(url);if(!['http:','https:'].includes(u.protocol))return}catch(e){return}
 const normalized=u.href;
 let item=lib.items.find(i=>i.url===normalized);
 if(!item){lib.items.unshift({id:libId(),url:normalized,title:u.hostname,category:lib.selected});libPersist();libRender()}
}
$('libCategory').onchange=e=>{lib.selected=e.target.value;libPersist();libRender()};
$('libNewCat').onclick=()=>{const name=prompt('新分类名称：');if(!name||!name.trim())return;const c={id:libId(),name:name.trim()};lib.categories.push(c);lib.selected=c.id;libPersist();libRender()};
$('libRenameCat').onclick=()=>{const c=lib.categories.find(c=>c.id===lib.selected);const name=prompt('修改分类名称：',c.name);if(name&&name.trim()){c.name=name.trim();libPersist();libRender()}};
$('libDeleteCat').onclick=()=>{if(lib.categories.length===1){alert('至少保留一个分类');return}const c=lib.categories.find(c=>c.id===lib.selected);const n=lib.items.filter(i=>i.category===c.id).length;if(!confirm(`删除分类「${c.name}」？其中 ${n} 条网址将移动到第一个其他分类。`))return;const dest=lib.categories.find(x=>x.id!==c.id);lib.items.forEach(i=>{if(i.category===c.id)i.category=dest.id});lib.categories=lib.categories.filter(x=>x.id!==c.id);lib.selected=dest.id;libPersist();libRender()};
libRender();
</script></body></html>
